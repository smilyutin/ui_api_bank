name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      performance: ${{ steps.filter.outputs.performance }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
            performance:
              - 'perf/**'
              - 'app.py'
              - 'auth.py'
              - 'database.py'
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - 'Dockerfile'
              - 'requirements.txt'

  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - uses: ./.github/actions/wait-for-app

      - name: Run Playwright tests
        run: npm test
        env:
          APP_INTERNAL_URL: http://web:5000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v

  # Runs on workflow_dispatch (manual trigger, any branch) or automatically
  # on push/pull_request when the diff touches perf/** or the app/infra files
  # k6 actually exercises - scoped the same way mobile-android is, so
  # unrelated changes (docs, test-suite-only edits) don't pay for a ~9-10
  # minute k6 ramp across three scenarios.
  performance:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.performance == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:5001
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - uses: ./.github/actions/wait-for-app

      # Real gate: 1 VU / 1 iteration through every flow. A failure here means
      # a payload-shape mismatch, not load-related degradation.
      - name: Run k6 smoke test
        run: k6 run perf/k6/smoke.js

      # Full scenarios are informational, not gates: perf/README.md documents
      # that the ramp intentionally exceeds the DB connection pool (max=10),
      # so rising latency/error rate past ~10 VUs is an expected finding to
      # review, not a build failure to chase.
      - name: Run k6 scenarios in parallel
        continue-on-error: true
        run: |
          mkdir -p perf/results
          k6 run --summary-export=perf/results/auth.json perf/k6/scenarios/auth.js &
          k6 run --summary-export=perf/results/money-movement.json perf/k6/scenarios/money-movement.js &
          k6 run --summary-export=perf/results/dashboard-read.json perf/k6/scenarios/dashboard-read.js &
          wait

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k6-results
          path: perf/results/
          retention-days: 30

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v

  # Runs on workflow_dispatch (manual trigger, any branch) or automatically
  # on push/pull_request when the diff touches mobile/** - the IPv4 loopback
  # bind fix (mobile/wdio.android.conf.ts) has been verified locally, so
  # this no longer needs to stay fully manual, but it's still scoped to
  # mobile/** changes rather than every push/PR to avoid slowing those down
  # with an Android emulator boot for unrelated changes.
  mobile-android:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM for hardware-accelerated emulator boot
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - uses: ./.github/actions/wait-for-app

      - name: Clear Allure results
        run: rm -rf allure-results/

      - name: Run Appium mobile tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: npm run test:mobile:android

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-android-allure-report
          path: allure-report/
          retention-days: 30

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v