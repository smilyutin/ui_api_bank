name: Deploy VulnBank

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and smoke-test (local Docker only)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start stack locally
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Health check (localhost only)
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5001; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed" && exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
